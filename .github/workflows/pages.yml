name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  # 报告每日由 daily-report.yml 生成并提交，本工作流随 push 触发部署

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          mkdir -p site
          cp index.html site/ 2>/dev/null || true
          cp manifest.json site/ 2>/dev/null || true
          cp feed.xml site/ 2>/dev/null || true
          cp -r report site/ 2>/dev/null || true
          echo "" > site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
