name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  # 报告每日由 daily-report.yml 生成并提交，本工作流随 push 触发部署

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - name: Stage site
        run: |
          mkdir -p _deploy
          cp site/* _deploy/ 2>/dev/null || true
          cp -r report _deploy/report 2>/dev/null || true
          echo "" > _deploy/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _deploy

      - id: deployment
        uses: actions/deploy-pages@v5
