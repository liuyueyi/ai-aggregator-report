name: Daily Report

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show LLM configuration
        run: |
          if [ -n "${{ secrets.LLM_API_KEY }}" ]; then
            echo "LLM: enabled (LLM_API_KEY configured)"
          else
            echo "LLM: disabled (no LLM_API_KEY; pipeline runs in degraded/mock path)"
          fi
          echo "LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}"
          echo "LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}"

      - name: Run pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          # GitHub Actions 非 TTY，Python 默认块缓冲会导致日志滞留缓冲区，run 页面看似空白
          PYTHONUNBUFFERED: "1"
        run: python -u -m aiaggr.main

      - name: Write run summary
        if: always()
        run: |
          echo "### Daily Report 执行结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d report ]; then
            find report -name "*.md" ! -name "index.md" -printf "%T@ %p\n" | sort -rn | head -10 | sed 's|^[0-9.]* ||; s|^|- |' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ${{ job.status }} = "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ 生成成功" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit reports and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report .state site
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "daily report: $(date -u +%Y-%m-%d)"
          # 远端可能有并发提交导致非快进推送失败：rebase 到最新远端后再推，失败重试
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash; then
              if git push; then
                echo "Pushed successfully"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "push/rebase attempt $i failed, retrying..."
            sleep 10
          done
          echo "Failed to push after retries"
          exit 1