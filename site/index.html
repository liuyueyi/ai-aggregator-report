<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 聚合日报 · 每日热点一站看</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --bg-grad: radial-gradient(1200px 600px at 80% -10%, rgba(99,102,241,.18), transparent 60%),
               radial-gradient(900px 500px at -10% 10%, rgba(34,211,238,.12), transparent 55%);
    --panel: rgba(255,255,255,.045);
    --panel-2: rgba(255,255,255,.025);
    --border: rgba(255,255,255,.09);
    --border-strong: rgba(255,255,255,.16);
    --text: #e8edf4;
    --muted: #8a94a6;
    --faint: #5b6678;
    --accent: #6ea8fe;
    --accent-2: #22d3ee;
    --grad: linear-gradient(135deg, #818cf8, #22d3ee);
    --heat: #ff9a6c;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --radius: 16px;
    --maxw: 1180px;
  }
  html[data-theme="light"] {
    --bg: #f4f6fb;
    --bg-grad: radial-gradient(1100px 560px at 85% -12%, rgba(99,102,241,.12), transparent 60%),
               radial-gradient(820px 460px at -8% 6%, rgba(34,211,238,.10), transparent 55%);
    --panel: rgba(255,255,255,.75);
    --panel-2: rgba(255,255,255,.5);
    --border: rgba(15,23,42,.10);
    --border-strong: rgba(15,23,42,.18);
    --text: #1b2330;
    --muted: #5b6678;
    --faint: #94a0b3;
    --shadow: 0 10px 30px rgba(15,23,42,.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Hiragino Sans GB", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(12px);
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: var(--maxw); margin: 0 auto; padding: 14px 22px;
    display: flex; align-items: center; gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: var(--grad); font-size: 20px; box-shadow: 0 6px 18px rgba(99,102,241,.35);
  }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  .brand .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .header-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: .15s;
  }
  .icon-btn:hover { border-color: var(--border-strong); text-decoration: none; }

  /* ---------- layout ---------- */
  .layout {
    max-width: var(--maxw); margin: 0 auto; padding: 22px;
    display: grid; grid-template-columns: 268px 1fr; gap: 26px; align-items: start;
  }
  .sidebar { position: sticky; top: 86px; display: flex; flex-direction: column; gap: 18px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  }
  .card h3 {
    margin: 0 0 12px; font-size: 13px; letter-spacing: .8px; color: var(--muted);
    text-transform: uppercase; font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  .card h3 .hint { margin-left: auto; font-size: 11px; color: var(--faint); text-transform: none; letter-spacing: 0; }

  /* ---------- follow chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: .15s; user-select: none;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.active {
    color: #fff; border-color: transparent;
    background: var(--grad); box-shadow: 0 4px 14px rgba(99,102,241,.35);
  }
  .chip .cnt { font-size: 11px; opacity: .8; }
  .follow-tools { display: flex; gap: 8px; margin-top: 12px; }
  .follow-tools .mini {
    flex: 1; text-align: center; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--muted); border-radius: 9px; padding: 6px; font-size: 12px; cursor: pointer;
  }
  .follow-tools .mini:hover { color: var(--text); border-color: var(--border-strong); }

  /* ---------- days control ---------- */
  .days-row { display: flex; gap: 8px; }
  .days-row button {
    flex: 1; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    border-radius: 9px; padding: 8px 0; font-size: 13px; cursor: pointer; transition: .15s;
  }
  .days-row button.active { color: #fff; border-color: transparent; background: var(--grad); }
  .days-row button:hover { border-color: var(--border-strong); }

  /* ---------- date nav ---------- */
  .dates { display: flex; flex-direction: column; gap: 4px; max-height: 46vh; overflow-y: auto; }
  .date-link {
    display: flex; align-items: baseline; gap: 8px; padding: 8px 10px; border-radius: 10px;
    color: var(--text); cursor: pointer; font-size: 13px; transition: .12s;
  }
  .date-link:hover { background: var(--panel-2); text-decoration: none; }
  .date-link.active { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .date-link .rel { margin-left: auto; font-size: 11px; color: var(--faint); }

  /* ---------- main / hero ---------- */
  main { min-width: 0; }
  .hero {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 24px; box-shadow: var(--shadow); margin-bottom: 22px;
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  }
  .hero .big { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
  .hero .big span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .desc { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .stats { margin-left: auto; display: flex; gap: 26px; }
  .stat { text-align: center; }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 11px; color: var(--muted); }

  .day { margin-bottom: 30px; }
  .day-head {
    display: flex; align-items: center; gap: 12px; margin: 0 4px 14px;
    position: sticky; top: 78px; z-index: 5;
  }
  .day-head::before { content: ""; position: absolute; left: -22px; right: -22px; top: -10px; bottom: -10px;
    background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(6px); z-index: -1; }
  .day-head .d { font-size: 17px; font-weight: 700; }
  .day-head .rel { font-size: 12px; color: var(--accent-2); border: 1px solid var(--border);
    padding: 2px 9px; border-radius: 999px; }
  .day-head .line { flex: 1; height: 1px; background: var(--border); }

  .topic-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .topic-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 16px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column;
    cursor: pointer; transition: .18s; position: relative; overflow: hidden;
  }
  .topic-card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--grad); opacity: .9;
  }
  .topic-card:hover { transform: translateY(-3px); border-color: var(--border-strong); }
  .tc-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .tc-head .ic { font-size: 19px; }
  .tc-head .nm { font-size: 15px; font-weight: 700; }
  .tc-tag { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; min-height: 18px; }
  .tc-tag:empty { display: none; }

  .items { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .item { border-top: 1px solid var(--border); padding-top: 10px; }
  .item:first-child { border-top: none; padding-top: 0; }
  .item-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; }
  .item-title:hover { color: var(--accent); }
  .item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 5px 0; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.src { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); border-color: transparent; }
  .badge.heat { color: var(--heat); border-color: transparent; background: color-mix(in srgb, var(--heat) 14%, transparent); }
  .item-sum { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; }
  .tc-foot { font-size: 12.5px; color: var(--accent); margin-top: auto; padding-top: 8px; }
  .topic-card:hover .tc-foot { text-decoration: underline; }

  .skeleton {
    background: linear-gradient(90deg, var(--panel-2) 25%, var(--panel) 37%, var(--panel-2) 63%);
    background-size: 400% 100%; animation: sk 1.3s infinite; border-radius: 8px;
  }
  @keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  .empty .big { font-size: 16px; color: var(--text); margin-bottom: 6px; }

  /* ---------- full report view ---------- */
  .report-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 26px 30px; box-shadow: var(--shadow); }
  .report-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  .report-head .ic { font-size: 22px; }
  .report-head h2 { margin: 0; font-size: 20px; }
  .report-head .back { margin-left: auto; }
  .report-meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .report-body h1 { font-size: 24px; } .report-body h2 { font-size: 19px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .report-body h3 { font-size: 16px; margin: 20px 0 8px; }
  .report-body h4 { font-size: 14.5px; margin: 14px 0 4px; }
  .report-body a { color: var(--accent); }
  .report-body blockquote { border-left: 3px solid var(--accent); margin: 10px 0; padding: 4px 14px; color: var(--muted); background: var(--panel-2); border-radius: 0 8px 8px 0; }
  .report-body code { background: var(--panel-2); padding: 2px 6px; border-radius: 5px; font-size: 13px; }
  .report-body pre { background: var(--panel-2); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
  .report-body pre code { background: none; padding: 0; }
  .report-body table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13px; }
  .report-body th, .report-body td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
  .report-body th { background: var(--panel-2); }
  .report-body hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
  .report-body ul, .report-body ol { padding-left: 22px; }
  .report-body img { max-width: 100%; border-radius: 10px; }

  /* ---------- responsive ---------- */
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .dates { max-height: none; }
    .stats { margin-left: 0; width: 100%; justify-content: space-around; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand" onclick="location.hash=''">
      <div class="logo">📡</div>
      <div>
        <h1>AI 聚合日报</h1>
        <div class="sub">多源热点 · 每日多主题简报</div>
      </div>
    </div>
    <div class="header-actions">
      <a class="icon-btn" href="feed.xml" title="RSS 订阅">⊕ RSS</a>
      <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="card">
      <h3>我的关注 <span class="hint">点选标签</span></h3>
      <div class="chips" id="chips"></div>
      <div class="follow-tools">
        <div class="mini" id="selAll">全选</div>
        <div class="mini" id="selNone">清空</div>
      </div>
    </div>
    <div class="card">
      <h3>时间范围</h3>
      <div class="days-row" id="daysRow">
        <button data-d="7">近 7 天</button>
        <button data-d="14">近 14 天</button>
        <button data-d="30">近 30 天</button>
      </div>
    </div>
    <div class="card">
      <h3>按日期浏览</h3>
      <div class="dates" id="dates"></div>
    </div>
    <div class="card" id="topicsCard" style="display:none">
      <h3>📋 选题建议</h3>
      <div id="topicsLinks"></div>
    </div>
  </aside>
  <main id="content"></main>
</div>

<script>
// ---------- 部署路径探测（兼容 GitHub Pages 子路径） ----------
const PATH_PREFIX = (() => {
  return (location.pathname || "").replace(/\/index\.html$/, "").replace(/\/+$/, "");
})();
const MANIFEST_URL = PATH_PREFIX + "/manifest.json";

// 追踪专题兜底名称/图标（config 未配置）
const FALLBACK = {
  "ai-cli":  { name: "AI CLI 生态", icon: "🛠️" },
  "ai-agents": { name: "AI Agent 生态", icon: "🤖" },
  "topic_suggestions": { name: "选题建议", icon: "📋" },
};

const LS_FOLLOW = "aiagg_followed";
const LS_DAYS = "aiagg_days";
const LS_THEME = "aiagg_theme";

// 选题建议是特殊报告：仅作侧边栏「选题建议」入口，不参与关注流/日期视图卡片
const SUGGEST_KEY = "topic_suggestions";
function feedKeys(keys) { return keys.filter(k => k !== SUGGEST_KEY); }

let manifest = { topics: {}, dates: [] };
const mdCache = new Map(); // `${date}/${key}` -> markdown text

// ---------- 偏好持久化 ----------
function loadFollowed() {
  try { return new Set(JSON.parse(localStorage.getItem(LS_FOLLOW) || "null")); }
  catch { return null; }
}
function allKeys() { return Object.keys(manifest.topics); }
function loadFollowed() {
  // null = 默认关注全部；Set = 显式选择（空 Set = 都不关注）
  const raw = localStorage.getItem(LS_FOLLOW);
  if (raw === null) return null;
  try {
    const v = JSON.parse(raw);
    return v === null ? null : new Set(v);
  } catch { return null; }
}
function saveFollowed(s) {
  // null 或已覆盖全部主题 → 记为"全选"（存 null 哨兵），否则存显式数组
  if (s === null || s.size === allKeys().length) localStorage.setItem(LS_FOLLOW, "null");
  else localStorage.setItem(LS_FOLLOW, JSON.stringify([...s]));
}
function loadDays() { return parseInt(localStorage.getItem(LS_DAYS) || "7", 10); }
function saveDays(n) { localStorage.setItem(LS_DAYS, String(n)); }

let followed = loadFollowed();   // null = 默认关注全部
let daysN = loadDays();
let selectedDate = null;         // null = 聚合关注流；否则按该日期浏览

// ---------- 工具 ----------
function topicMeta(key) {
  return manifest.topics[key] || FALLBACK[key] || { name: key, icon: "" };
}
function relDate(dateStr) {
  const t = new Date(dateStr + "T00:00:00");
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((today - t) / 86400000);
  if (diff === 0) return "今天";
  if (diff === 1) return "昨天";
  if (diff > 1) return diff + " 天前";
  return "";
}
async function getMD(date, key) {
  const id = date + "/" + key;
  if (mdCache.has(id)) return mdCache.get(id);
  const [y, m, d] = date.split("-");
  const url = PATH_PREFIX + `/report/${y}/${m}/${d}/${key}.md`;
  const resp = await fetch(url, { cache: "no-store" });
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const txt = await resp.text();
  mdCache.set(id, txt);
  return txt;
}

// 从报告 markdown 抽取 `#### N. [标题](url)` 条目
function parseItems(md) {
  const lines = md.split(/\r?\n/);
  const items = [];
  let cur = null;
  const reHead = /^####\s+\d+\.\s+\[([^\]]+)\]\(([^)]+)\)/;
  for (const line of lines) {
    const m = line.match(reHead);
    if (m) {
      if (cur) items.push(cur);
      cur = { title: m[1], url: m[2], source: "", time: "", heat: "", summary: "" };
      continue;
    }
    if (cur) {
      let x;
      if ((x = line.match(/\*\*来源\*\*:\s*(.+)/))) {
        const rest = x[1];
        cur.source = rest.split("|")[0].trim();
        const tm = rest.match(/\*\*时间\*\*:\s*([^|]+)/); if (tm) cur.time = tm[1].trim();
        const ht = rest.match(/\*\*热度\*\*:\s*([^|]+)/); if (ht) cur.heat = ht[1].trim();
      }
      else if ((x = line.match(/\*\*时间\*\*:\s*(.+)/))) cur.time = x[1].trim();
      else if ((x = line.match(/\*\*热度\*\*:\s*(.+)/))) cur.heat = x[1].trim();
      else if ((x = line.match(/\*\*摘要\*\*:\s*(.+)/))) cur.summary = x[1].trim();
      else if (/^#{2,4}\s/.test(line)) { items.push(cur); cur = null; }
    }
  }
  if (cur) items.push(cur);
  return items;
}

function esc(s) {
  return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// ---------- 侧边栏 ----------
function renderSidebar() {
  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  const keys = Object.keys(manifest.topics);
  for (const key of keys) {
    const meta = topicMeta(key);
    const el = document.createElement("div");
    el.className = "chip" + (isFollowed(key) ? " active" : "");
    el.innerHTML = `${meta.icon ? esc(meta.icon) + " " : ""}${esc(meta.name)}`;
    el.onclick = () => toggleFollow(key);
    chips.appendChild(el);
  }

  const daysRow = document.getElementById("daysRow");
  daysRow.querySelectorAll("button").forEach(b => {
    b.classList.toggle("active", parseInt(b.dataset.d, 10) === daysN);
    b.onclick = () => {
      daysN = parseInt(b.dataset.d, 10); saveDays(daysN);
      selectedDate = null; renderSidebar();
      if (location.hash !== "") location.hash = ""; else renderHome();
    };
  });

  const dates = document.getElementById("dates");
  dates.innerHTML = "";
  for (const e of manifest.dates) {
    const a = document.createElement("a");
    a.className = "date-link";
    a.href = "#" + e.date;
    a.innerHTML = `<span>${esc(e.date)}</span><span class="rel">${esc(relDate(e.date))}</span>`;
    dates.appendChild(a);
  }

  // 选题建议链接：仅显示有 topic_suggestions 的日期
  const topicsCard = document.getElementById("topicsCard");
  const topicsLinks = document.getElementById("topicsLinks");
  topicsLinks.innerHTML = "";
  const datesWithTopics = manifest.dates.filter(e =>
    e.reports.some(r => r.key === "topic_suggestions")
  );
  if (datesWithTopics.length) {
    topicsCard.style.display = "";
    for (const e of datesWithTopics.slice(0, 7)) {
      const a = document.createElement("a");
      a.className = "date-link";
      a.href = "#" + e.date + "/topic_suggestions";
      a.innerHTML = `<span>${esc(e.date)}</span><span class="rel">${esc(relDate(e.date))}</span>`;
      topicsLinks.appendChild(a);
    }
  }
}

function isFollowed(key) { return followed === null || followed.has(key); }
function toggleFollow(key) {
  if (followed === null) followed = new Set(allKeys());
  if (followed.has(key)) followed.delete(key); else followed.add(key);
  saveFollowed(followed);
  renderSidebar();
  // 正在阅读某篇报告详情时不打断，仅刷新左侧高亮；否则让右侧关注流/日期视图立即跟随
  const parts = location.hash.replace(/^#/, "").split("/");
  if (parts.length !== 2) renderRight();
}

// 右侧统一渲染：有选中日期→该日视图，否则→聚合关注流
function renderRight() { if (selectedDate) renderDay(selectedDate); else renderHome(); }

// ---------- 首页：聚合关注流 ----------
async function renderHome() {
  const main = document.getElementById("content");
  const windowDates = manifest.dates.slice(0, daysN);
  const totalTopics = windowDates.reduce((n, e) => n + e.reports.filter(r => isFollowed(r.key)).length, 0);
  const latest = manifest.dates[0];
  const followedCount = allKeys().filter(isFollowed).length;

  main.innerHTML = `
    <div class="hero">
      <div>
        <div class="big">每日 <span>AI 热点</span> 一站看</div>
        <div class="desc">已关注 ${followedCount} 个主题 · 显示最近 ${daysN} 天</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="n">${manifest.dates.length}</div><div class="l">累计天数</div></div>
        <div class="stat"><div class="n">${totalTopics}</div><div class="l">本期日报</div></div>
        <div class="stat"><div class="n">${latest ? latest.date.slice(5) : "-"}</div><div class="l">最新日期</div></div>
      </div>
    </div>
    <div id="feed"><div class="empty"><div class="skeleton" style="height:200px"></div></div></div>
  `;

  if (!windowDates.length) {
    document.getElementById("feed").innerHTML = '<div class="empty"><div class="big">暂无报告</div>先运行一次采集生成日报吧。</div>';
    return;
  }

  const feed = document.getElementById("feed");
  for (const e of windowDates) {
    const repKeys = feedKeys(e.reports.map(r => r.key)).filter(isFollowed);
    if (!repKeys.length) continue;

    const dayEl = document.createElement("section");
    dayEl.className = "day";
    dayEl.innerHTML = `
      <div class="day-head"><span class="d">${esc(e.date)}</span><span class="rel">${esc(relDate(e.date))}</span><span class="line"></span></div>
      <div class="topic-cards"></div>`;
    const grid = dayEl.querySelector(".topic-cards");
    feed.appendChild(dayEl);

    const results = await Promise.all(repKeys.map(async (key) => {
      try { return { key, ok: true, md: await getMD(e.date, key), tagline: (e.reports.find(r => r.key === key) || {}).tagline || "" }; }
      catch { return { key, ok: false }; }
    }));
    for (const r of results) {
      if (!r.ok) continue;
      grid.appendChild(topicCardEl(e.date, r.key, r.tagline, r.md));
    }
  }
  if (!feed.children.length) {
    feed.innerHTML = '<div class="empty"><div class="big">没有关注的主题</div>在左侧「我的关注」里勾选一些标签吧。</div>';
  }
}

// 单张主题卡片（首页与日期视图共用）
function topicCardEl(date, key, tagline, md) {
  const meta = topicMeta(key);
  const items = parseItems(md).slice(0, 5);
  const itemHtml = items.map(it => `
    <li class="item">
      <a class="item-title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
      <div class="item-meta">
        ${it.source ? `<span class="badge src">${esc(it.source)}</span>` : ""}
        ${it.heat ? `<span class="badge heat">🔥 ${esc(it.heat)}</span>` : ""}
        ${it.time && it.time !== "时间未知" ? `<span class="badge">${esc(it.time)}</span>` : ""}
      </div>
      ${it.summary ? `<p class="item-sum">${esc(it.summary)}</p>` : ""}
    </li>`).join("");
  const card = document.createElement("article");
  card.className = "topic-card";
  card.onclick = (ev) => { if (ev.target.closest("a")) return; location.hash = "#" + date + "/" + key; };
  card.innerHTML = `
    <div class="tc-head"><span class="ic">${esc(meta.icon)}</span><span class="nm">${esc(meta.name)}</span></div>
    <div class="tc-tag">${esc(tagline)}</div>
    <ul class="items">${itemHtml || '<li class="item"><div class="item-sum">（无条目）</div></li>'}</ul>
    <div class="tc-foot">查看完整日报 →</div>`;
  return card;
}

// ---------- 按日期浏览某一天 ----------
async function renderDay(date) {
  const main = document.getElementById("content");
  main.innerHTML = `
    <div class="day-head" style="position:static;margin:0 0 16px">
      <a class="icon-btn" href="#" id="backHome">← 返回关注流</a>
      <span class="d">${esc(date)}</span><span class="rel">${esc(relDate(date))}</span><span class="line"></span>
    </div>
    <div id="feed"><div class="empty"><div class="skeleton" style="height:200px"></div></div></div>`;
  document.getElementById("backHome").onclick = (e) => { e.preventDefault(); selectedDate = null; location.hash = ""; };

  const entry = manifest.dates.find(e => e.date === date);
  if (!entry) {
    document.getElementById("feed").innerHTML = '<div class="empty"><div class="big">该日暂无报告</div></div>';
    return;
  }
  const repKeys = feedKeys(entry.reports.map(r => r.key)).filter(isFollowed);
  if (!repKeys.length) {
    document.getElementById("feed").innerHTML = '<div class="empty"><div class="big">没有关注的主题</div>在左侧「我的关注」里勾选一些标签吧。</div>';
    return;
  }

  const feed = document.getElementById("feed");
  const dayEl = document.createElement("section");
  dayEl.className = "day";
  dayEl.innerHTML = `<div class="topic-cards"></div>`;
  const grid = dayEl.querySelector(".topic-cards");
  feed.appendChild(dayEl);

  const results = await Promise.all(repKeys.map(async (key) => {
    try { return { key, ok: true, md: await getMD(date, key), tagline: (entry.reports.find(r => r.key === key) || {}).tagline || "" }; }
    catch { return { key, ok: false }; }
  }));
  for (const r of results) {
    if (!r.ok) continue;
    grid.appendChild(topicCardEl(date, r.key, r.tagline, r.md));
  }
}

// ---------- 单篇报告 ----------
async function renderReport(date, key) {
  const main = document.getElementById("content");
  const meta = topicMeta(key);
  main.innerHTML = `<div class="report-wrap"><div class="empty"><div class="skeleton" style="height:300px"></div></div></div>`;
  try {
    const md = await getMD(date, key);
    const html = marked.parse(md);
    main.innerHTML = `
      <div class="report-wrap">
        <div class="report-head">
          <span class="ic">${esc(meta.icon)}</span>
          <h2>${esc(meta.name)}</h2>
          <a class="icon-btn back" href="#" >← 返回关注流</a>
        </div>
        <div class="report-meta">${esc(date)} · 来源：AI 聚合日报</div>
        <div class="report-body">${html}</div>
      </div>`;
    // 外部链接新标签打开
    main.querySelectorAll(".report-body a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  } catch (err) {
    main.innerHTML = `<div class="report-wrap"><div class="empty"><div class="big">加载失败</div>${esc(err.message)}</div></div>`;
  }
}

// ---------- 路由 ----------
function route() {
  document.querySelectorAll(".date-link").forEach(a => a.classList.remove("active"));
  const hash = location.hash.replace(/^#/, "");
  if (!hash) { selectedDate = null; renderSidebar(); renderHome(); return; }
  const parts = hash.split("/");
  if (parts.length === 2) {
    const link = document.querySelector(`.date-link[href="#${parts[0]}"]`);
    if (link) link.classList.add("active");
    renderReport(parts[0], parts[1]);
    return;
  }
  // 单段：按日期浏览该日（左侧日期点击即进入此视图）
  selectedDate = parts[0];
  const link = document.querySelector(`.date-link[href="#${parts[0]}"]`);
  if (link) link.classList.add("active");
  renderDay(parts[0]);
}

// ---------- 主题切换 ----------
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("themeBtn").textContent = t === "light" ? "☀️" : "🌙";
}
document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  localStorage.setItem(LS_THEME, cur); applyTheme(cur);
};

// ---------- 启动 ----------
document.getElementById("selAll").onclick = () => {
  followed = null; saveFollowed(null); renderSidebar(); renderRight();
};
document.getElementById("selNone").onclick = () => {
  followed = new Set(); saveFollowed(followed); renderSidebar(); renderRight();
};

applyTheme(localStorage.getItem(LS_THEME) || "dark");

(async () => {
  try {
    manifest = await (await fetch(MANIFEST_URL, { cache: "no-store" })).json();
  } catch (e) {
    document.getElementById("content").innerHTML = '<div class="empty"><div class="big">无法加载 manifest.json</div>' + esc(e.message) + "</div>";
    return;
  }
  // 默认关注全部；localStorage 中无记录或存 null 哨兵时保持 null
  renderSidebar();
  route();
})();
window.addEventListener("hashchange", route);
</script>
</body>
</html>
